  <g id="texto-fase-568">
    <text class="cls-1" text-anchor="middle" x="148.68" y="215">Fase</text>
    <text class="cls-1" text-anchor="middle" x="148.68" y="240">Folicular</text>
    <text class="cls-4" x="85.68" y="286">Suele haber</text>
    <text class="cls-4" x="85.68" y="312">más energía y</text>
    <text class="cls-4" x="85.68" y="338">un sueño más</text>
    <text class="cls-4" x="85.68" y="364">estable.</text>
  </g>
  <g id="texto-fase-817">
    <text class="cls-1" text-anchor="middle" x="397.68" y="216">Ovulación</text>
    <text class="cls-4" x="334.68" y="286">Puede ser más</text>
    <text class="cls-4" x="334.68" y="312">ligero o con</text>
    <text class="cls-4" x="334.68" y="338">mayor facilidad</text>
    <text class="cls-4" x="334.68" y="364">para despertar.</text>
  </g>
  <g id="texto-fase-1069">
    <text class="cls-1" text-anchor="middle" x="649.68" y="215">Fase</text>
    <text class="cls-1" text-anchor="middle" x="649.68" y="240">Lútea</text>
    <text class="cls-4" x="586.68" y="286">Es común sentir</text>
    <text class="cls-4" x="586.68" y="312">más cansancio</text>
    <text class="cls-4" x="586.68" y="338">y necesitar</text>
    <text class="cls-4" x="586.68" y="364">más descanso.</text>
  </g>
  <g id="texto-fase-1307">
    <text class="cls-1" text-anchor="middle" x="887.68" y="181.84">Fase</text>
    <text class="cls-1" text-anchor="middle" x="887.68" y="206.84">Menstrual</text>
    <text class="cls-4" x="823.24" y="252.84">El sueño puede</text>
    <text class="cls-4" x="823.24" y="278.84">volverse más</text>
    <text class="cls-4" x="823.24" y="304.84">profundo, pero</text>
    <text class="cls-4" x="823.24" y="330.84">también verse</text>
    <text class="cls-4" x="823.24" y="356.84">afectado por</text>
    <text class="cls-4" x="823.24" y="382.84">molestias físicas.</text>
  </g>
