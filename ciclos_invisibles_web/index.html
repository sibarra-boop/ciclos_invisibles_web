<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciclos invisibles</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <section class="intro">
          <div class="brand-wrap">
            <img class="brand-logo" src="img/logo.png" alt="Ciclos invisibles" />
          </div>

          <h2>Todo lo que sentimos tiene contexto.</h2>

          <p>
            Explora cómo se relacionan<br />
            nuestros procesos, emociones<br />
            y el entorno que nos rodea.
          </p>

          <button type="button">Haz clic en un punto<br />para descubrir más</button>
        </section>

        <section class="chart" aria-label="Diagrama de ciclos">
          <div class="circle-layer circle-1">
            <img src="img/circulo1.png" alt="Círculo 1" />
          </div>

          <div class="circle-layer circle-2">
            <img src="img/circulo2.png" alt="Círculo 2" />
          </div>

          <div class="circle-layer circle-3">
            <img src="img/circulo3.png" alt="Círculo 3" />
          </div>
          <div class="circle-layer circle-4">
            <img src="img/circulo4.png" alt="Círculo 4" />
          </div>

          <div class="center-mark">
            <img src="img/simbolo.png" alt="Símbolo de ciclos invisibles" />
          </div>

          <div class="category category-ovulacion">
            <img src="img/circulo_ovulacion.png" alt="Ovulación" />
            <span>Ovulación</span>
          </div>

          <div class="category category-folicular">
            <img src="img/aura_folicular.png" alt="Fase folicular" />
            <span>Fase<br />Folicular</span>
          </div>

          <div class="category category-lutea">
            <img src="img/aura_lutea.png" alt="Fase lútea" />
            <span>Fase<br />Lútea</span>
          </div>

          <div class="category category-menstrual">
            <img src="img/circulo_menstrual.png" alt="Fase menstrual" />
            <span>Fase<br />Menstrual</span>
          </div>
        </section>
      </header>
    </div>
  </body>
</html>
